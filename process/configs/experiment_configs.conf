# SARD Experiment Configurations
# CIFAR-10, MobileNetV2 student, WRN-34-10 robust teacher, ResNet-56 natural teacher

# ============================================================
# Experiment 0: Pipeline verification (5 epochs)
# ============================================================
[exp0_sard_verify]
sard_saa = 1
sard_rcd = 1
epochs = 5
prefix = sard_exp0_verify
gpu = 0
description = "Pipeline verification with SARD enabled"

# ============================================================
# Experiment 1: Module ablation (60 epochs, 4 configs parallel)
# ============================================================
[exp1_baseline]
sard_saa = 0
sard_rcd = 0
epochs = 60
prefix = sard_exp1_baseline
gpu = 0
description = "CIARD baseline (no SAA, no RCD)"

[exp1_saa_only]
sard_saa = 1
sard_rcd = 0
epochs = 60
prefix = sard_exp1_saa_only
gpu = 0
description = "SAA only (strength-adaptive attack)"

[exp1_rcd_only]
sard_saa = 0
sard_rcd = 1
epochs = 60
prefix = sard_exp1_rcd_only
gpu = 1
description = "RCD only (reliability-calibrated distillation)"

[exp1_sard_full]
sard_saa = 1
sard_rcd = 1
epochs = 60
prefix = sard_exp1_sard_full
gpu = 1
description = "Full SARD (SAA + RCD)"

# ============================================================
# Experiment 2: Compare with CIARD baseline (100 epochs)
# ============================================================
[exp2_sard]
sard_saa = 1
sard_rcd = 1
epochs = 100
prefix = sard_exp2
gpu = 0
description = "SARD 100 epochs"

[exp2_baseline]
sard_saa = 0
sard_rcd = 0
epochs = 100
prefix = baseline_exp2
gpu = 1
description = "CIARD baseline 100 epochs"

# ============================================================
# Experiment 3: Full comparison (200 epochs)
# ============================================================
[exp3_sard]
sard_saa = 1
sard_rcd = 1
epochs = 200
prefix = sard_exp3
gpu = 0
description = "SARD 200 epochs"

[exp3_baseline]
sard_saa = 0
sard_rcd = 0
epochs = 200
prefix = baseline_exp3
gpu = 1
description = "CIARD baseline 200 epochs"
